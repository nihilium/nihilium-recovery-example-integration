# The app container: the built SPA, nothing else. `/api` is routed to the server by the host's
# nginx (see docs/deployment.md), so this container never needs to know where the server is.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build output: cache hard. index.html: never, so a deploy is picked up on reload.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
